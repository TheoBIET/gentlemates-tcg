name: Release

on:
  release:
    types: [published]

jobs:
  data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the tag format
        run: |
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] \
            || { echo "::error::Tag '$TAG' must look like v2026.09.10, or v2026.09.10.1 for a fix"; exit 1; }
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run --locked scripts/validate.py
      - run: uv run --locked scripts/generate.py
      - run: zip -r data.zip data
      - run: gh release upload "$TAG" data.zip --clobber
