<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle Mates TCG</title>
<style>
:root {
  color-scheme: dark;
  --ground: #121212; --surface: #19191c; --elevated: #222226; --muted: #2a2a2d; --border: #222226;
  --foreground: #eeeef0; --foreground-muted: #88888c; --subtle: #b2b3be; --subtle-muted: #5f606b;
  --primary: #6d47e8; --primary-hover: #8a6bf1;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; scrollbar-width: none; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ground); color: var(--foreground); font: 16px/normal "Uncut Sans", system-ui, sans-serif;
  letter-spacing: -0.64px; }

.search { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; padding: 16px 24px; pointer-events: none; }
.search-box { position: relative; width: min(100%, 480px); pointer-events: auto; }
.search input { width: 100%; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border);
  background: rgb(25 25 28 / .9); backdrop-filter: blur(12px); box-shadow: 0 10px 30px -10px rgb(0 0 0 / .6);
  color: var(--foreground); font: inherit; font-size: .875rem; outline: none; }
.search input::placeholder { color: var(--foreground-muted); }
.search input:focus { border-color: var(--primary); }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 60vh; overflow: auto; margin: 0; padding: 6px;
  list-style: none; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
  box-shadow: 0 25px 50px -12px rgb(0 0 0 / .6); }
.results a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--foreground);
  font-size: .875rem; text-decoration: none; }
.results a:hover, .results a:focus-visible { background: var(--elevated); outline: none; }
.result-name { flex: 1; font-weight: 600; }
.empty { padding: 8px 10px; color: var(--foreground-muted); font-size: .875rem; }

main { max-width: 1200px; margin: 0 auto; padding: 0 24px 64px; }
.collection { display: flex; align-items: center; gap: 12px; margin: 16px 0 24px; font-size: 1.25rem; }
.collection img { height: 64px; }
.card { display: grid; grid-template-columns: minmax(200px, 340px) minmax(0, 1fr); gap: 24px; align-items: start;
  margin-bottom: 32px; scroll-margin-top: 88px; }
.art { display: block; width: 100%; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 16px;
  box-shadow: 0 25px 50px -12px rgb(0 0 0 / .6); outline: 2px solid transparent; outline-offset: 4px; transition: outline-color .3s; }
.card:target .art { outline-color: var(--primary); }

/* The panel matches the card image height until expanded. */
.side { position: relative; align-self: stretch; min-width: 0; }
.panel { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px; overflow: hidden;
  border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.card.expanded .panel { position: relative; }

.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge, .count { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--foreground-muted); font-size: .75rem; font-weight: 600; letter-spacing: -0.025em;
  white-space: nowrap; }
.badge.tinted { border-color: transparent; color: var(--c); background: color-mix(in srgb, var(--c) 20%, transparent); }
.badge.essence { border-color: color-mix(in srgb, var(--c) 40%, transparent); color: var(--c);
  background: color-mix(in srgb, var(--c) 10%, transparent); }
.badge.essence i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.name { font-size: 1.25rem; font-weight: 700; }
.sub, .flavor { display: flex; align-items: baseline; gap: 6px 12px; color: var(--foreground-muted); font-size: .875rem; }
.flavor { justify-content: space-between; }
.flavor small { flex-shrink: 0; font-size: .75rem; }
.chip { padding: 2px 6px; border-radius: 6px; background: rgb(136 136 140 / .2); color: var(--foreground); font-size: .75rem;
  font-weight: 600; font-variant-numeric: tabular-nums; }

.label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.label code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--foreground-muted);
  font: 500 .75rem var(--mono); letter-spacing: 0; }
.label a { color: inherit; text-decoration: none; }
.label a:hover { color: var(--foreground); text-decoration: underline; }
.actions { display: flex; flex-shrink: 0; gap: 6px; }
.actions button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent;
  color: var(--foreground-muted); font: inherit; font-size: .75rem; font-weight: 600; cursor: pointer; }
.actions button:hover { background: var(--muted); color: var(--foreground); }
[data-action="expand"] { display: none; }
.card.overflow [data-action="expand"], .card.expanded [data-action="expand"] { display: inline-block; }

.code { position: relative; display: flex; flex: 1; min-height: 0; }
pre { flex: 1; margin: 0; padding: 14px 16px; overflow: hidden; border-radius: 12px; border: 1px solid var(--border);
  background: var(--ground); color: var(--subtle-muted); font: 12.5px/1.6 var(--mono); letter-spacing: 0;
  white-space: pre-wrap; overflow-wrap: anywhere; }
.card.overflow:not(.expanded) .code::after { content: ""; position: absolute; inset: auto 1px 1px; height: 72px;
  border-radius: 0 0 12px 12px; background: linear-gradient(transparent, var(--ground)); pointer-events: none; }
.k { color: var(--primary-hover); } .s { color: var(--subtle); } .n { color: var(--foreground); } .l { color: var(--foreground-muted); }

@media (max-width: 760px) {
  .card { grid-template-columns: 1fr; }
  .art { max-width: 340px; }
  .panel { position: relative; }
  .card:not(.expanded) pre { max-height: 320px; }
  .search, main { padding-inline: 16px; }
  .collection img { height: 48px; }
}
</style>
</head>
<body>
<div class="search">
  <div class="search-box">
    <input type="search" placeholder="Search a card: number, name, rarity, essence…" autocomplete="off" autofocus>
    <ul class="results" hidden><!-- results --><li class="empty" hidden>No card found</li></ul>
  </div>
</div>
<main><!-- cards --></main>
<script>
const normalize = (text) => text.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();

const input = document.querySelector(".search input");
const results = document.querySelector(".results");
const items = [...results.querySelectorAll("li[data-search]")];

const search = () => {
  const words = normalize(input.value).split(/\s+/).filter(Boolean);
  for (const item of items) item.hidden = !words.every((word) => item.dataset.search.includes(word));
  results.querySelector(".empty").hidden = items.some((item) => !item.hidden);
  results.hidden = words.length === 0;
};
input.addEventListener("input", search);
input.addEventListener("focus", search);
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") items.find((item) => !item.hidden)?.querySelector("a").click();
  if (event.key === "Escape") { input.value = ""; search(); input.blur(); }
});
document.addEventListener("click", (event) => {
  if (!event.target.closest(".search") || event.target.closest(".results a")) results.hidden = true;
});

// Show "Expand" only when the JSON is cut by the card height.
const checkOverflow = (card) => {
  const pre = card.querySelector("pre");
  if (!card.classList.contains("expanded")) card.classList.toggle("overflow", pre.scrollHeight > pre.clientHeight + 1);
};
const observer = new ResizeObserver((entries) => entries.forEach((entry) => checkOverflow(entry.target.closest(".card"))));
document.querySelectorAll(".card pre").forEach((pre) => observer.observe(pre));

document.addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const card = button.closest(".card");
  if (button.dataset.action === "copy") {
    await navigator.clipboard.writeText(card.querySelector("pre").textContent);
    button.textContent = "Copied!";
    setTimeout(() => (button.textContent = "Copy"), 1500);
  } else {
    const expanded = card.classList.toggle("expanded");
    button.textContent = expanded ? "Collapse" : "Expand";
    if (!expanded) card.scrollIntoView({ block: "nearest" });
  }
});
</script>
</body>
</html>
